name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Playwright dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libgtk-3-0 \
            libgbm1

      - name: Install package
        run: |
          python -m pip install --upgrade pip

          pip install -e .

          pip install \
            black==23.11.0 \
            ruff==0.13.0 \
            pytest==9.1.1

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      - name: Check formatting
        run: |
          black --check .

      - name: Lint
        run: |
          ruff check .

      - name: Compile source
        run: |
          python -m compileall src

      - name: Run tests
        run: |
          pytest

      - name: Smoke test
        run: |
          docbuildr --version
          docbuildr --help
