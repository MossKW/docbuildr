<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ title }}</title>

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/cover.css">

<!-- KaTeX -->
<link rel="stylesheet" href="vendor/katex/katex.min.css">

</head>

<body>

<div class="book">

<header class="book-header">
    <div class="brand">DocBuildr</div>
</header>

<main class="book-content">
{{ content | safe }}
</main>

<footer class="book-footer">
    Generated with <strong>DocBuildr</strong>
</footer>

</div>

<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    renderMathInElement(document.body, {
        delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false }
        ],
        throwOnError: false,
        strict: "ignore"
    });

});
</script>

<script type="module">
import mermaid from "./vendor/mermaid/mermaid.min.js";

mermaid.initialize({
    startOnLoad: true,
    theme: "default",
    securityLevel: "loose",
});
</script>

</body>

</html>
