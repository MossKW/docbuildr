[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docbuildr"
version = "0.3.0-alpha2"
description = "Build beautiful books from documentation"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.62",
    "beautifulsoup4>=4.15",
    "jinja2>=3.1",
    "lxml>=6.1",
    "markdownify>=1.2",
    "requests>=2.32",
]

[project.scripts]
docbuildr = "docs2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
