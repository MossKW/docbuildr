[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docs2pdf"
version = "0.1.0"
description = "Convert documentation websites into a PDF book"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.62",
    "beautifulsoup4>=4.15",
    "jinja2>=3.1",
    "lxml>=6.1",
    "markdownify>=3.8",
    "requests>=2.32",
]

[project.scripts]
docs2pdf = "docs2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
