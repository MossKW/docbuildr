[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docbuildr"
version = "0.3.0a7"

description = "Generate Markdown, HTML, and PDF books from online documentation."
readme = "README.md"
requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "Moss.kw", email = "k.pollapong@gmail.com" }
]

keywords = [
    "documentation",
    "markdown",
    "pdf",
    "html",
    "playwright",
    "static-site",
    "book",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "playwright>=1.62",
    "beautifulsoup4>=4.15",
    "jinja2>=3.1",
    "lxml>=6.1",
    "markdown>=3.8",
    "markdownify>=1.2",
    "Pygments>=2.19",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/MossKW/docbuildr"
Repository = "https://github.com/MossKW/docbuildr"
Issues = "https://github.com/MossKW/docbuildr/issues"
Documentation = "https://github.com/MossKW/docbuildr"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
]

[project.scripts]
docbuildr = "docbuildr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docbuildr = [
    "templates/book.html",
    "templates/styles/*",
    "templates/vendor/**/*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
addopts = [
    "-ra",
]
